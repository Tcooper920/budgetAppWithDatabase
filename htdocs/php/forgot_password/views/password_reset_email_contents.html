<!-- Confirmation email contents... -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <title>Verification code</title>
  </head>
  <body>
    <img
      src="cid:image_cid"
      width="230"
      alt="Budget Builder"
      title="Budget Builder"
    />
    <hr style="height: 2px; border: 0; background-color: #ced4da" />
    <div
      style="
        width: 640px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        color: #24273a;
      "
    >
      <h1>BudgetBuilder password reset</h1>
      <p>
        To complete your password reset process, please verify your email
        address by entering the confirmation code below.
      </p>
      <p>
        <strong style="font-weight: bold">Confirmation code:</strong>
        {{confirmation_code}}
      </p>
      <p>If you did not request a password reset, please ignore this email.</p>
      <p>Thank you, <br />BudgetBuilder</p>
    </div>
  </body>
</html>
